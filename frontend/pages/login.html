<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Analistas — Plataforma de Selección</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body class="login-body" style="visibility:hidden">
  <div class="login-wrapper">
    <div class="login-card card">
      <div class="login-header">
        <div class="login-icon">🎓</div>
        <h1>Plataforma de Selección</h1>
        <p>Acceso exclusivo para analistas</p>
      </div>

      <div id="alert-error" class="alert alert-error"></div>

      <form id="form-login" novalidate>
        <div class="form-group">
          <label for="username">Usuario <span class="required">*</span></label>
          <input type="text" id="username" name="username" class="form-control"
            placeholder="Ingresa tu usuario" autocomplete="username" />
          <span id="err_username" class="field-error"></span>
        </div>
        <div class="form-group">
          <label for="password">Contraseña <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" class="form-control"
              placeholder="Ingresa tu contraseña" autocomplete="current-password" />
            <button type="button" id="btn-toggle-pass" class="btn-eye" title="Mostrar/ocultar contraseña">👁</button>
          </div>
          <span id="err_password" class="field-error"></span>
        </div>
        <button type="submit" id="btn-login" class="btn btn-primary" style="width:100%;margin-top:0.5rem">
          Iniciar sesión
        </button>
      </form>

      <div class="login-hint">
        <small>¿Eres practicante? <a href="../index.html">Regístrate aquí</a></small>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
